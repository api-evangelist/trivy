naftiko: "1.0.0-alpha1"

info:
  label: "Trivy Server API"
  description: >-
    Shared capability definition for the Trivy Server API. Trivy server runs in client/server
    mode, maintaining vulnerability databases locally and exposing HTTP endpoints for health
    checks and version information.
  tags:
    - Security
    - Vulnerability Scanning
    - Containers
    - DevSecOps
    - Open Source
  created: "2026-05-03"
  modified: "2026-05-03"

binds:
  - namespace: env
    keys:
      TRIVY_TOKEN: TRIVY_TOKEN

capability:
  consumes:
    - type: http
      namespace: trivy-server
      baseUri: http://localhost:4954
      description: "Trivy server HTTP API for health checks and version information"
      authentication:
        type: apikey
        key: Trivy-Token
        value: "{{TRIVY_TOKEN}}"
        placement: header
      resources:
        - name: health
          path: /healthz
          description: "Server health check"
          operations:
            - name: health-check
              method: GET
              description: "Check if Trivy server is running and healthy"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: version
          path: /version
          description: "Server version information"
          operations:
            - name: get-version
              method: GET
              description: "Get Trivy server and database version information"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8100
      namespace: trivy-server-rest
      resources:
        - path: /v1/health
          name: health
          description: "Trivy server health"
          operations:
            - method: GET
              name: health-check
              description: "Check Trivy server health"
              call: "trivy-server.health-check"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/version
          name: version
          description: "Trivy server version"
          operations:
            - method: GET
              name: get-version
              description: "Get Trivy server version"
              call: "trivy-server.get-version"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9100
      namespace: trivy-server-mcp
      transport: http
      tools:
        - name: health-check
          description: "Check if Trivy server is healthy"
          hints:
            readOnly: true
            openWorld: false
          call: "trivy-server.health-check"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-version
          description: "Get Trivy server and vulnerability database version"
          hints:
            readOnly: true
            openWorld: false
          call: "trivy-server.get-version"
          outputParameters:
            - type: object
              mapping: "$."
