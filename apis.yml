apis:
- aid: trivy:trivy-operator
  name: Trivy Operator
  description: >-
    The Trivy Operator is a Kubernetes-native security toolkit that automatically scans clusters and generates
    security reports as Kubernetes Custom Resources. It defines 12 CRDs covering vulnerability reports,
    config audit reports, exposed secret reports, SBOM reports, RBAC assessment reports, infrastructure
    assessment reports, and compliance reports.
  humanURL: https://github.com/aquasecurity/trivy-operator
  baseURL: https://kubernetes.default.svc
