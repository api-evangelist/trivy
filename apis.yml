aid: trivy
name: Trivy
description: >-
  Trivy is a comprehensive and versatile open-source security scanner from Aqua Security that finds vulnerabilities,
  misconfigurations, secrets, and SBOM in containers, Kubernetes, code repositories, clouds, and more. Trivy runs as a
  CLI tool, in client/server mode with an HTTP API, and as a Kubernetes Operator (trivy-operator) that continuously
  scans clusters and generates security reports as native Kubernetes Custom Resources.
