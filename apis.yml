- aid: trivy:trivy-cli
  name: Trivy CLI
  description: >-
    The primary interface for Trivy is its command-line tool, which scans container images, filesystems,
    Git repositories, Kubernetes clusters, virtual machine images, and SBOMs. Supports multiple output
    formats including JSON, SARIF, CycloneDX, SPDX, and table output for CI/CD integration.
  humanURL: https://trivy.dev/latest/docs/
